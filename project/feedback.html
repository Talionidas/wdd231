<script type="module">

const results = document.querySelector("#formResults");

const params = new URLSearchParams(
    window.location.search
);


results.innerHTML = `

    <p>
        <strong>Name:</strong>
        ${params.get("name")}
    </p>


    <p>
        <strong>Email:</strong>
        ${params.get("email")}
    </p>


    <p>
        <strong>Message:</strong>
        ${params.get("message")}
    </p>

`;

</script>
